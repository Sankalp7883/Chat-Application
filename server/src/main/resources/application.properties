# Profile Configuration
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Web/Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/sample-chat
spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JWT configuration
app.jwt.secret=${JWT_SECRET:change-this-local-development-jwt-signing-key-32chars-min}

# H2 Datasource Configuration (In-Memory default for local dev)
spring.datasource.url=jdbc:h2:mem:websocket_chat;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Multipart configurations
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
